name: Publish OpenCode V2 prerelease

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: Type the exact package version to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # This branch intentionally publishes only the package's guarded V2 prerelease.
    if: github.ref == 'refs/heads/opencode-v2' && inputs.confirm_version == '3.0.0-opencode-v2'
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Verify release identity and version
        run: |
          test "$(node -p "require('./package.json').name")" = "opencode-snippets"
          test "$(node -p "require('./package.json').version")" = "${{ inputs.confirm_version }}"
          node -e "const v=require('./package.json').version;if(!/^3\.0\.0-opencode-v2$/.test(v))process.exit(1)"

      - name: Install, validate, and build
        run: |
          bun install --frozen-lockfile
          bun run format:check
          bun run typecheck
          bun test
          bun run build
          npm pack --dry-run

      - name: Publish with npm trusted publishing
        run: npm publish --provenance --access public --tag opencode-v2

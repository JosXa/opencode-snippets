name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      confirm_version:
        description: Type the exact package version to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Verify release identity and version
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          test "$(node -p "require('./package.json').name")" = "opencode-snippets"
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF" = "refs/tags/v$version"; else test "$version" = "$CONFIRM_VERSION"; fi
          node -e "const v=require('./package.json').version;if(!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(v))process.exit(1)"

      - name: Install, validate, and build
        run: |
          bun install --frozen-lockfile
          bun run format:check
          bun run typecheck
          bun test
          bun run build
          npm pack --dry-run

      - name: Publish with npm trusted publishing
        run: npm publish --provenance --access public --tag latest

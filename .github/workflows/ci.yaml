name: CI

on:
  push:
    branches: [main, opencode-v2]
  pull_request:
    branches: [main, opencode-v2]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check portable lockfile
        run: bun scripts/normalize-lockfile.ts --check

      - name: Run format check
        run: bun run format:check

      - name: Run typecheck
        run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

  runtime-v2:
    name: OpenCode 2 runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Install matching OpenCode 2 CLI
        run: bun add --global --trust "@opencode/cli@$(bun -p 'require("./package.json").dependencies["@opencode/plugin"]')"

      - name: Run runtime tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: bun run test:v2

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-v2-runtime
          path: ${{ runner.temp }}/opencode/snippets-v2-runtime-*
          include-hidden-files: true
          if-no-files-found: ignore
